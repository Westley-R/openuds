server {
    listen 80;
    server_name uds.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name uds.local;

    ssl_certificate     /etc/pki/tls/certs/uds.crt;
    ssl_certificate_key /etc/pki/tls/private/uds.key;

    location /uds/res/ {
        alias /opt/openuds/server/src/static/;
    }

    location / {
        proxy_pass http://unix:/run/openuds/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}